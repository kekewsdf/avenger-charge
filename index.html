<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Avenger Charge — Suivi des recharges et simulateur de trajets pour Jeep Avenger électrique">
  <title>Avenger Charge</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
  <link rel="stylesheet" href="css/style.css">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self';">
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1>Avenger Charge</h1>
      <div class="header-actions">
        <span id="dernier-soc" class="badge-soc" hidden>—</span>
        <button id="btn-synchro-ha" class="btn-icon" title="Synchroniser Home Assistant" hidden aria-label="Synchroniser Home Assistant">⟳</button>
      </div>
    </header>

    <main id="main-content" role="main"></main>

    <nav class="nav-bottom" role="navigation" aria-label="Navigation principale">
      <a href="#accueil" data-onglet="accueil" class="nav-item active">
        <span class="nav-icon" aria-hidden="true">🏠</span>
        <span class="nav-label">Accueil</span>
      </a>
      <a href="#recharges" data-onglet="recharges" class="nav-item">
        <span class="nav-icon" aria-hidden="true">🔌</span>
        <span class="nav-label">Recharges</span>
      </a>
      <a href="#trajets" data-onglet="trajets" class="nav-item">
        <span class="nav-icon" aria-hidden="true">🛣️</span>
        <span class="nav-label">Trajets</span>
      </a>
      <a href="#simuler" data-onglet="simuler" class="nav-item">
        <span class="nav-icon" aria-hidden="true">🧮</span>
        <span class="nav-label">Simuler</span>
      </a>
      <a href="#reglages" data-onglet="reglages" class="nav-item">
        <span class="nav-icon" aria-hidden="true">⚙️</span>
        <span class="nav-label">Réglages</span>
      </a>
    </nav>
  </div>

  <template id="tpl-recharge-en-cours">
    <div class="banniere-recharge-en-cours" role="status" aria-live="polite">
      <div class="banniere-contenu">
        <span class="banniere-texte" id="banniere-texte"></span>
        <button type="button" class="btn btn-principal" id="btn-je-debranche">Je débranche</button>
      </div>
    </div>
  </template>

  <template id="tpl-toast">
    <div class="toast" role="alert" aria-live="assertive"></div>
  </template>

  <script src="vendor/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
